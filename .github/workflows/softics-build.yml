name: softics-build

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: x86_64-unknown-linux-musl

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & publish (amd64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}
          components: rustfmt

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_TARGET }}

      - name: Build binaries via cross (native deps — sodiumoxide, openssl)
        run: cross build --release --target ${{ env.RUST_TARGET }}

      - name: Stage binaries for docker-classic
        run: |
          mkdir -p docker-classic
          cp -v target/${{ env.RUST_TARGET }}/release/hbbs docker-classic/hbbs
          cp -v target/${{ env.RUST_TARGET }}/release/hbbr docker-classic/hbbr
          chmod +x docker-classic/hbbs docker-classic/hbbr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMG: ${{ steps.image.outputs.name }}
        run: |
          set -eu
          SHA="${GITHUB_SHA::12}"
          TAGS="${IMG}:sha-${SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMG}:latest"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMG}:${VERSION},${IMG}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Computed tags: ${TAGS}"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-classic
          file: ./docker-classic/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.vendor=Softics GmbH
